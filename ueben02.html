<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}

<body>
<header><div class="wrap"><h1>Kapitel 2 · Online üben</h1><p>Нажмите на правильный ответ — сразу увидите решение и короткое объяснение. В конце каждого урока есть блок «Написать самому», он по желанию.</p></div></header>

<script>
const D={"N": 2, "L": [{"id": "l4", "title": "Lektion 4 · Was kostet der Computer?", "sets": [{"t": "1 · der, die oder das?", "hint": "Выберите артикль.", "pool": 10, "items": [{"q": "… Laptop", "o": ["der", "die", "das"], "e": ""}, {"q": "… Computer", "o": ["der", "die", "das"], "e": "-er у приборов — часто der."}, {"q": "… Handy", "o": ["das", "der", "die"], "e": ""}, {"q": "… Tablet", "o": ["das", "der", "die"], "e": ""}, {"q": "… Kamera", "o": ["die", "der", "das"], "e": ""}, {"q": "… Lampe", "o": ["die", "der", "das"], "e": "-e — чаще die."}, {"q": "… Tasche", "o": ["die", "der", "das"], "e": ""}, {"q": "… Stuhl", "o": ["der", "die", "das"], "e": ""}, {"q": "… Tisch", "o": ["der", "die", "das"], "e": ""}, {"q": "… Buch", "o": ["das", "der", "die"], "e": "По-русски «она», а по-немецки das!"}, {"q": "… Brille", "o": ["die", "der", "das"], "e": ""}, {"q": "… Uhr", "o": ["die", "der", "das"], "e": ""}, {"q": "… Fahrrad", "o": ["das", "der", "die"], "e": ""}, {"q": "… Schlüssel", "o": ["der", "die", "das"], "e": ""}, {"q": "… Sofa", "o": ["das", "der", "die"], "e": ""}, {"q": "… Bett", "o": ["das", "der", "die"], "e": ""}, {"q": "… Regal", "o": ["das", "der", "die"], "e": ""}, {"q": "… Schrank", "o": ["der", "die", "das"], "e": ""}, {"q": "… Fernseher", "o": ["der", "die", "das"], "e": ""}, {"q": "… Rucksack", "o": ["der", "die", "das"], "e": ""}, {"q": "… Mädchen", "o": ["das", "der", "die"], "e": "-chen — всегда das."}]}, {"t": "2 · Plural", "hint": "Выберите множественное число.", "pool": 8, "items": [{"q": "der Stuhl → die …", "o": ["Stühle", "Stuhls", "Stuhle"], "e": ""}, {"q": "das Buch → die …", "o": ["Bücher", "Buchs", "Buche"], "e": ""}, {"q": "die Lampe → die …", "o": ["Lampen", "Lampes", "Lampe"], "e": ""}, {"q": "der Laptop → die …", "o": ["Laptops", "Laptope", "Laptopen"], "e": ""}, {"q": "das Handy → die …", "o": ["Handys", "Handies", "Handyen"], "e": ""}, {"q": "der Rucksack → die …", "o": ["Rucksäcke", "Rucksacks", "Rucksacke"], "e": ""}, {"q": "die Uhr → die …", "o": ["Uhren", "Uhrs", "Uhre"], "e": ""}, {"q": "das Fahrrad → die …", "o": ["Fahrräder", "Fahrrads", "Fahrrade"], "e": ""}, {"q": "der Computer → die …", "o": ["Computer", "Computers", "Computern"], "e": "Слова на -er часто не меняются."}, {"q": "der Tisch → die …", "o": ["Tische", "Tischs", "Tischen"], "e": ""}]}, {"t": "3 · er, sie, es", "hint": "Местоимение — по артиклю, не по русскому переводу.", "items": [{"q": "Der Tisch ist groß. … ist neu.", "o": ["Er", "Sie", "Es"], "e": ""}, {"q": "Die Brille ist schön. … kostet 90 Euro.", "o": ["Sie", "Er", "Es"], "e": "die Brille → sie (хотя по-русски «очки» — они)."}, {"q": "Das Sofa ist alt. … ist bequem.", "o": ["Es", "Er", "Sie"], "e": ""}, {"q": "Die Kopfhörer sind toll. … sind praktisch.", "o": ["Sie", "Es", "Er"], "e": "Мн. ч. → sie."}, {"q": "Wo ist der Schlüssel? — … ist hier.", "o": ["Er", "Sie", "Es"], "e": ""}, {"q": "Das Buch ist interessant. … kostet 12 Euro.", "o": ["Es", "Sie", "Er"], "e": "das Buch → es (по-русски «она»)."}, {"q": "Die Uhr ist kaputt. … ist alt.", "o": ["Sie", "Er", "Es"], "e": ""}]}, {"t": "4 · kostet oder kosten?", "hint": "Один предмет — kostet, много — kosten.", "items": [{"q": "Was … das Tablet?", "o": ["kostet", "kosten"], "e": ""}, {"q": "Was … die Kopfhörer?", "o": ["kosten", "kostet"], "e": ""}, {"q": "Was … der Rucksack?", "o": ["kostet", "kosten"], "e": ""}, {"q": "Was … die Bücher?", "o": ["kosten", "kostet"], "e": ""}, {"q": "Was … die Lampe?", "o": ["kostet", "kosten"], "e": ""}, {"q": "Die Stühle … 120 Euro.", "o": ["kosten", "kostet"], "e": ""}]}, {"t": "5 · Zahlen bis 1000", "hint": "Выберите правильное число.", "pool": 7, "items": [{"q": "150", "o": ["hundertfünfzig", "fünfzighundert", "hundertundfünfzig"], "e": ""}, {"q": "230", "o": ["zweihundertdreißig", "dreißigzweihundert", "zweihundertdreizehn"], "e": ""}, {"q": "499", "o": ["vierhundertneunundneunzig", "vierhundertneunzigneun", "neunundneunzigvierhundert"], "e": ""}, {"q": "1000", "o": ["tausend", "hunderthundert", "zehnhundert"], "e": ""}, {"q": "dreihundertfünfundsechzig", "o": ["365", "356", "635"], "e": ""}, {"q": "hundertsiebzehn", "o": ["117", "170", "107"], "e": ""}, {"q": "sechshundertsechzig", "o": ["660", "606", "616"], "e": ""}, {"q": "101", "o": ["hunderteins", "hundertundeins", "einhundertein"], "e": ""}]}, {"t": "6 · Preise lesen", "hint": "Как прочитать цену?", "items": [{"q": "4,99 €", "o": ["vier Euro neunundneunzig", "vier Komma neun neun Euros", "neunundneunzig Euro vier"], "e": ""}, {"q": "0,50 €", "o": ["fünfzig Cent", "null Euro fünf", "fünf Cent"], "e": ""}, {"q": "39,90 €", "o": ["neununddreißig Euro neunzig", "dreißigneun Euro neunzig", "neununddreißig Euros neunzig"], "e": "Euro во мн. ч. не меняется: Euro, не Euros."}, {"q": "Как правильно написать цену по-немецки?", "o": ["4,99 €", "4.99 €"], "e": "В Германии в ценах — запятая."}, {"q": "Как читается «Euro»?", "o": ["[ойро]", "[евро]", "[юро]"], "e": ""}]}, {"t": "7 · Wie ist das?", "hint": "Выберите противоположность или подходящее слово.", "items": [{"q": "teuer ↔ …", "o": ["billig", "neu", "klein"], "e": ""}, {"q": "neu ↔ …", "o": ["alt", "groß", "schön"], "e": ""}, {"q": "groß ↔ …", "o": ["klein", "alt", "billig"], "e": ""}, {"q": "schön ↔ …", "o": ["hässlich", "kaputt", "praktisch"], "e": ""}, {"q": "Das Handy funktioniert nicht. Es ist …", "o": ["kaputt", "günstig", "modern"], "e": ""}, {"q": "699 Euro für einen Laptop? Wie …!", "o": ["teuer", "billig", "klein"], "e": ""}]}, {"t": "8 · Wiederholung: Kapitel 1", "hint": "Повторяем первую главу.", "pool": 7, "items": [{"q": "… Vater ist Arzt.", "o": ["Mein", "Meine"], "e": "der Vater → mein."}, {"q": "… Tasche ist neu.", "o": ["Meine", "Mein"], "e": "die Tasche → meine."}, {"q": "… Handy ist kaputt.", "o": ["Mein", "Meine"], "e": "das Handy → mein."}, {"q": "Du … zwei Kinder.", "o": ["hast", "habst", "hat"], "e": ""}, {"q": "Ich bin … (программистка)", "o": ["Programmiererin.", "eine Programmiererin."], "e": ""}, {"q": "Was … du beruflich?", "o": ["machst", "macht", "machen"], "e": ""}, {"q": "Mein Kollege kommt aus … Schweiz.", "o": ["der", "dem", "den"], "e": ""}, {"q": "Ihr … Studenten.", "o": ["seid", "sind", "seit"], "e": ""}]}], "write": [{"t": "S1 · Artikel schreiben", "hint": "Напишите слово с артиклем.", "items": [{"q": "ноутбук", "a": ["der Laptop"]}, {"q": "лампа", "a": ["die Lampe"]}, {"q": "мобильный телефон", "a": ["das Handy"]}, {"q": "книга", "a": ["das Buch"]}, {"q": "стул", "a": ["der Stuhl"]}, {"q": "часы", "a": ["die Uhr"]}]}, {"t": "S2 · Zahlen schreiben", "hint": "Напишите число словами.", "items": [{"q": "120", "a": ["hundertzwanzig", "einhundertzwanzig"]}, {"q": "350", "a": ["dreihundertfünfzig"]}, {"q": "499", "a": ["vierhundertneunundneunzig"]}, {"q": "1000", "a": ["tausend", "eintausend"]}]}, {"t": "S3 · Sätze bauen", "hint": "Составьте предложение.", "items": [{"q": "was / kosten / der Laptop ?", "a": ["Was kostet der Laptop?"]}, {"q": "die Kopfhörer / kosten / 40 Euro", "a": ["Die Kopfhörer kosten 40 Euro.", "Die Kopfhörer kosten vierzig Euro."]}, {"q": "das Handy / sein / kaputt", "a": ["Das Handy ist kaputt."]}, {"q": "die Lampe? — sie / sein / schön", "a": ["Sie ist schön."], "tip": "die Lampe → sie"}, {"q": "mein / Tasche / sein / neu", "a": ["Meine Tasche ist neu."], "tip": "die Tasche → meine"}]}]}]};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function renderSet(el,set){
  const items=set.pool?shuffle(set.items).slice(0,set.pool):set.items;
  let ok=0,done=0;
  el.querySelector('.qs').innerHTML=items.map((it,i)=>`<div class="q" data-i="${i}"><p>${esc(it.q)}</p><div class="opts">${shuffle(it.o).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>${it.e?`<div class="ex">${esc(it.e)}</div>`:''}</div>`).join('');
  const sc=el.querySelector('.score'); const upd=()=>sc.textContent=`${ok} из ${items.length} верно`; upd();
  el.querySelectorAll('.q').forEach(q=>{
    const it=items[+q.dataset.i];
    q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(q.classList.contains('done'))return;
      q.classList.add('done'); done++;
      q.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===it.o[0]) x.classList.add('ok')});
      if(b.dataset.v===it.o[0]) ok++; else b.classList.add('no');
      upd(); if(done===items.length) sc.textContent+=ok===items.length?' – super!':'';
    });
  });
}

// ---------- Письменные задания ----------
const unq=s=>s.normalize('NFC').replace(/[„“”"‚‘’']/g,'').replace(/\s+/g,' ').replace(/\s+([,.!?])/g,'$1').trim().replace(/[.!?]+$/,'').trim();
const noC=s=>s.replace(/,/g,'');
const fold=s=>s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss');
function judge(inp,acc){
  const u=unq(inp); if(!u) return {k:'empty'};
  for(const a0 of acc){const a=unq(a0);
    if(u===a) return {k:'ok'};
    if(noC(u)===noC(a)) return {k:'ok',tip:'Обратите внимание на запятую.'};
    if(fold(noC(u))===fold(noC(a))) return {k:'ok',tip:'Верно! Красивее с ä, ö, ü, ß: '+a0};
  }
  for(const a0 of acc){const a=unq(a0);
    if(fold(noC(u)).toLowerCase()===fold(noC(a)).toLowerCase()) return {k:'mid',tip:'Почти! Проверьте большие и маленькие буквы.'};
    const m=a.match(/^(der|die|das) (.+)$/); if(m&&fold(u).toLowerCase()===fold(m[2]).toLowerCase()) return {k:'mid',tip:'Почти! Напишите существительное с артиклем.'};
  }
  return {k:'no'};
}
function renderWrite(el,set){
  const items=set.pool?shuffle(set.items).slice(0,set.pool):set.items;
  let ok=0;
  el.querySelector('.qs').innerHTML=items.map((it,i)=>`<div class="wq" data-i="${i}"><p>${esc(it.q)}</p>${it.h?`<p class="hint">${esc(it.h)}</p>`:''}
   ${it.a[0].length>28?'<textarea rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort"></textarea>':'<input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort">'}
   ${it.tip?`<p class="hint tipline" hidden>💡 ${esc(it.tip)}</p>`:''}<div class="wrow"><button class="chk">Проверить</button>${['ä','ö','ü','ß','Ä','Ö','Ü'].map(c=>`<button class="uml" data-c="${c}">${c}</button>`).join('')}${it.tip?'<button class="tip">Подсказка</button>':''}<button class="sol">Показать ответ</button></div>
   <div class="fb"></div></div>`).join('');
  const sc=el.querySelector('.score'); const upd=()=>sc.textContent=`${ok} из ${items.length} верно`; upd();
  el.querySelectorAll('.wq').forEach(q=>{
    const it=items[+q.dataset.i], inp=q.querySelector('input,textarea'), fb=q.querySelector('.fb'); let fin=false;
    const show=(cls,html)=>{fb.className='fb '+cls; fb.innerHTML=html};
    const sol=()=>`<small>Ответ: <b>${esc(it.a[0])}</b>${it.a.length>1?' · тоже верно: '+it.a.slice(1).map(esc).join(' · '):''}${it.e?'<br>'+esc(it.e):''}</small>`;
    const check=()=>{ if(fin) return; const r=judge(inp.value,it.a);
      if(r.k==='empty'){show('mid','Сначала напишите ответ.');return}
      if(r.k==='ok'){fin=true; ok++; upd(); inp.className='ok'; inp.readOnly=true; show('ok','Richtig! Верно!'+(r.tip?' '+esc(r.tip):'')+sol()); return}
      inp.className='no'; show(r.k==='mid'?'mid':'no',(r.k==='mid'?esc(r.tip):'Пока неверно.')+' Попробуйте ещё раз или нажмите «Показать ответ».');
    };
    q.querySelector('.chk').onclick=check;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
    const tb=q.querySelector('.tip'); if(tb) tb.onclick=()=>{q.querySelector('.tipline').hidden=false; tb.disabled=true; inp.focus()};
    q.querySelector('.sol').onclick=()=>{ if(fin) return; fin=true; inp.readOnly=true; show('no','Посмотрите ответ:'+sol()); };
    q.querySelectorAll('.uml').forEach(b=>{b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ if(fin) return;
      const s=inp.selectionStart??inp.value.length, e2=inp.selectionEnd??s; inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e2);
      inp.focus(); inp.setSelectionRange(s+1,s+1); }});
  });
}
let h='';
D.L.forEach(L=>{
  h+=`<section class="les" id="k${D.N}-${L.id}"><h2>${esc(L.title)}</h2>`;
  L.sets.forEach((s,i)=>{h+=`<div class="set" data-l="${L.id}" data-s="${i}"><div class="sethead"><h3>${esc(s.t)}</h3><span class="score"></span>${s.pool?'<button class="again">Новый раунд</button>':''}</div>${s.hint?`<p class="note">${esc(s.hint)}</p>`:''}<div class="qs"></div></div>`});
  if(L.write&&L.write.length){
    h+=`<div class="wblock"><h3>✍ Selbst schreiben · Написать самому</h3><p>Здесь ответ нужно напечатать. Это по желанию, блок можно пропустить.</p>`;
    L.write.forEach((s,i)=>{h+=`<div class="set" data-l="${L.id}" data-w="${i}"><div class="sethead"><h3>${esc(s.t)}</h3><span class="score"></span>${s.pool?'<button class="again">Новый раунд</button>':''}</div>${s.hint?`<p class="note">${esc(s.hint)}</p>`:''}<div class="qs"></div></div>`});
    h+=`</div>`;
  }
  h+=`</section>`;
});
document.querySelector('#app').innerHTML=h;
document.querySelectorAll('.set').forEach(el=>{
  const L=D.L.find(x=>x.id===el.dataset.l);
  const w=el.dataset.w!==undefined, s=w?L.write[+el.dataset.w]:L.sets[+el.dataset.s], r=w?renderWrite:renderSet;
  r(el,s);
  const a=el.querySelector('.again'); if(a) a.onclick=()=>r(el,s);
});
</script>
