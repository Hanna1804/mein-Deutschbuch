function compose(items,rs){
  // feste Reihenfolge, ausgewogene Runden; pro Runde h\u00f6chstens eine Aufgabe je Lemma k; kein Antwort-Leck innerhalb einer Runde
  const n=items.length, R0=Math.ceil(n/rs), cap=Math.ceil(n/R0), R=Array.from({length:R0},()=>({it:[],keys:{}}));
  const cnt={}; items.forEach(it=>{if(it.k) cnt[it.k]=(cnt[it.k]||0)+1});
  const idx=new Map(items.map((x,i)=>[x,i]));
  const fits=(r,it)=>r.it.length<cap&&!(it.k&&r.keys[it.k])&&!r.it.some(o=>leaks(it,o)||leaks(o,it));
  const add=(r,it)=>{r.it.push(it); if(it.k) r.keys[it.k]=1};
  const rest=[];
  items.forEach(it=>{ if(it.k&&cnt[it.k]>1){ let best=null; for(const r of R) if(fits(r,it)&&(!best||r.it.length<best.it.length)) best=r; if(best) add(best,it); else rest.push(it) } else rest.push(it) });
  rest.forEach(it=>{ let r=R.find(x=>fits(x,it)); if(!r){ r={it:[],keys:{}}; R.push(r) } add(r,it) });
  return R.filter(r=>r.it.length).map(r=>r.it.slice().sort((a,b)=>rk(a)-rk(b)||idx.get(a)-idx.get(b)));
}
function itemsOf(L,ex,star){
  let it=ex.it;
  if(L.lern&&star&&['c','w','m','srt'].includes(ex.k)){const f=it.filter(x=>x.st!==0); if(f.length>=Math.min(6,it.length)) it=f}
  return it;
}
const RC={};
function roundsOf(L,ex,star){
  const key=L.id+'|'+ex.id+'|'+(star?1:0); if(RC[key]) return RC[key];
  const it=itemsOf(L,ex,star); let r;
  if(['c','w','o','t'].includes(ex.k)&&ex.rs<it.length) r=compose(it,ex.rs);
  else {r=[]; for(let i=0;i<it.length;i+=ex.rs) r.push(it.slice(i,i+ex.rs)); if(r.length>1&&r[r.length-1].length<Math.ceil(ex.rs/2)&&['c','w','o','t'].includes(ex.k)){const l=r.pop(); r[r.length-1]=r[r.length-1].concat(l)}}
  return RC[key]=r;
}
const nameOf=ex=>ex.sub?ex.g+': '+ex.sub:ex.t;
const exLabel=e=>e.sub?e.id+' '+e.sub:e.id+' '+e.t;
const uebNr=ex=>ex.id==='T'?'Lektionstest':'\u00dcbung '+ex.id;
const isBoard=ex=>['s','srt','m','gap'].includes(ex.k);
function amount(L,ex,star){
  if(ex.k==='gap') return (ex.it[0].x.match(/\[\[/g)||[]).length+' L\u00fccken';
  if(ex.k==='s') return ex.it[0].s.length+' Angaben';
  const R=roundsOf(L,ex,star), n=R.reduce((a,b)=>a+b.length,0), rr=R.length>1?' \u00b7 '+R.length+' Runden':'';
  if(ex.k==='test') return n+' Aufgaben \u00b7 ca. 10 Minuten';
  if(ex.k==='m') return n+' Paare'+rr; if(ex.k==='srt') return n+' Nomen'+rr;
  return n+' Aufgaben'+rr;
}
// ---------- Fortschritt: jede Antwort wird sofort auf diesem Ger\u00e4t gespeichert ----------
const sigOf=items=>h32(items.map(i=>(i.q||i.w||i.t||'')+'|'+(i.o?i.o[0]:(i.a?i.a[0]:''))).join('~'));
const RUNK=(L,ex,r)=>`b2:run:${N}-${L.id}-${ex.id}/${r}`;
function readRun(L,ex,r,items){try{const o=JSON.parse(LS.get(RUNK(L,ex,r))||'null'); if(o&&o.sig===sigOf(items)) return o.a||[]}catch(e){} return []}
function itemRes(rec,it,ex){ if(!rec) return ''; const k=kindOf(it,ex); if(k==='t') return rec.pts===rec.max?'ok':'no'; if(k==='c') return rec.ok?'ok':'no'; return rec.ok1?'ok':'no'}
function roundStat(L,ex,r,items){
  const a=readRun(L,ex,r,items);
  if(isBoard(ex)){const b=a[0]; return {n:b?1:0,tasks:1,score:b?b.score:0,total:b?b.total:items.length}}
  let n=0,sc=0,tot=0;
  items.forEach((it,i)=>{const rec=a[i]; const k=kindOf(it,ex); if(k==='t'){tot+=(it.gp||[]).length; if(rec){n++; sc+=rec.pts}} else {tot++; if(rec){n++; if(itemRes(rec,it,ex)==='ok') sc++}}});
  return {n,tasks:items.length,score:sc,total:tot};
}
function status(L,ex,star){const R=roundsOf(L,ex,star); let n=0,tasks=0,sc=0,tot=0,full=0;
  R.forEach((items,i)=>{const s=roundStat(L,ex,i+1,items); n+=s.n; tasks+=s.tasks; sc+=s.score; tot+=s.total; if(s.n>=s.tasks) full++});
  return {R:R.length,n,tasks,sc,tot,full:R.length>0&&full===R.length}}

function refOf(it){ if(it.ref){const p=it.ref.split('-'); return [p[0],p[1]]} return [S.L.id,(S.ex.k==='test'&&it.src)?it.src:S.ex.id] }

// ---------- \u00dcbung ----------
let S=null;
function viewEx(R){
  const star=useStar(), rounds=roundsOf(R.L,R.ex,star), r=Math.min(Math.max(R.r,1),rounds.length||1);
  document.title='Deutsch B2 \u00b7 '+nameOf(R.ex);
  startRun({L:R.L,ex:R.ex,r,q:R.q,items:rounds[r-1]||[],rounds:rounds.length});

function startRun(o){
  S={...o,idx:0,ans:[]}; S.sig=sigOf(S.items);
  if(!S.retry) S.ans=readRun(S.L,S.ex,S.r,S.items);
  if(isBoard(S.ex)){ document.body.classList.add('nonav'); const k=S.ex.k; if(k==='s'||k==='srt') return boardBins(); if(k==='m') return boardMatch(); return boardGap() }

}
function saveRun(){ if(S.retry) return; LS.set(RUNK(S.L,S.ex,S.r),JSON.stringify({sig:S.sig,a:S.ans})) }
function tally(){
  if(isBoard(S.ex)){const b=S.ans[0]; return {score:b?b.score:0,total:b?b.total:S.items.length,n:b?1:0,open:b?[]:[1]}}

  S.items.forEach((it,i)=>{const rec=S.ans[i],k=kindOf(it,S.ex),mx=k==='t'?(it.gp||[]).length:1; tot+=mx;
    if(!rec) open.push(i+1); else {n++; if(k==='t') sc+=rec.pts; else if(itemRes(rec,it,S.ex)==='ok') sc++}});
  return {score:sc,total:tot,n,open};
}
function dotsHtml(){
  return S.items.map((_,i)=>{const r=itemRes(S.ans[i],S.items[i],S.ex); const cls=r||(i===S.idx?'cur':''); 
    return `<button class="dot ${cls}${i===S.idx&&r?' seen':''}" data-i="${i}" aria-label="Aufgabe ${i+1}${r==='ok'?', richtig':r==='no'?', falsch':''}${i===S.idx?', aktuell':''}">${r==='ok'?CHECK:(r==='no'?CROSS:i+1)}</button>`}).join('');
}
function openText(){const t=tally(); return (t.n>0&&t.open.length)?'Noch offen: '+t.open.join(', '):''}
function redrawDots(){const d=$('#dots'); if(d){d.innerHTML=dotsHtml(); bindDots()} const o=$('#open'); if(o) o.textContent=openText()}
function bindDots(){$$('#dots .dot').forEach(b=>b.onclick=()=>{S.idx=+b.dataset.i; task()})}
function frame(inner,showDots){
  const {L,ex,r}=S, R=S.rounds||1;
  const crumb=S.errMode?'Meine Fehler':`${uebNr(ex)}${R>1?' \u00b7 Runde '+r+' von '+R:''}`;
  let pills='';
  if(R>1&&!S.retry){pills=`<nav class="pills" aria-label="Runden"><span>Runde</span>${Array.from({length:R},(_,i)=>{const st=roundStat(L,ex,i+1,roundsOf(L,ex,useStar())[i]||[]); return `<a class="pill${i+1===r?' on':''}${st.n>=st.tasks&&st.tasks?' done':''}" href="${hashOf(L,ex,i+1)}" data-nav="replace" aria-label="Runde ${i+1}${i+1===r?', aktiv':''}">${i+1}</a>`}).join('')}</nav>`}
  const nb=`<div class="navb"><div class="in"><button id="prv"${S.idx<=0?' disabled':''}>\u2190 Zur\u00fcck</button><button class="res" id="resb">Ergebnis</button><button class="pri" id="nxb">${S.idx>=S.items.length-1?'Ergebnis ansehen':'Weiter \u2192'}</button></div></div>`;
  app.innerHTML=header(L,ex,crumb,S.errMode,S.errMode?'#fehler':'')+pills+(showDots?`<div class="dots" id="dots">${dotsHtml()}</div><p class="open" id="open">${esc(openText())}</p>`:'')+`<main>${inner}</main><div id="panel" class="panel" hidden></div>`+(showDots?nb:'');
  const cp=$('#cplink'); if(cp) cp.onclick=()=>copy(location.href.split('?')[0]+(useStar()?'':'?s=0'),'Link kopiert');
  if(showDots){bindDots(); $('#prv').onclick=()=>{if(S.idx>0){S.idx--;task()}}; $('#nxb').onclick=()=>{if(S.idx<S.items.length-1){S.idx++;task()} else result()}; $('#resb').onclick=result}
  else document.body.classList.add('nonav');
}
function task(){
  if(!S.items.length) return result();
  const it=S.items[S.idx], k=kindOf(it,S.ex), rec=S.ans[S.idx]||null;
  const meta=`<div class="qmeta">Aufgabe ${S.idx+1} von ${S.items.length}${S.idx===0&&S.ex.h&&S.ex.k!=='test'?' \u00b7 '+esc(S.ex.h):''}</div>`;
  if(k==='o') return taskO(it,meta,rec); if(k==='w') return taskW(it,meta,rec); if(k==='t') return taskT(it,meta,rec); return taskC(it,meta,rec);
}
function commit(rec,ok,it,kind){
  S.ans[S.idx]=rec; saveRun();
  if(ok) delErr(it); else if(!S.errMode) addErr(it,kind);
  redrawDots();
}
const letterOf=(opts,v)=>'abcd'[opts.indexOf(v)]||'?';
const ctxHtml=it=>it.ctx?`<p class="ctx">${hl(it.ctx,it.word)}</p>`:'';

function taskC(it,meta,rec0){
  const opts=sshuf(it.o,(it.q||'')+'|'+it.o[0]);
  frame(`${meta}${ctxHtml(it)}<p class="q">${esc(it.q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><span class="l">${'abcd'[i]}</span><span class="tx">${esc(o)}</span></button>`).join('')}</div>`,true);
  const show=rec=>{
    const v=rec.v, ok=rec.ok; $$('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===it.o[0]) x.classList.add('ok')}); if(!ok) $$('.opt').find(x=>x.dataset.v===v).classList.add('no');
    const e=it.e?`<br><span class="sm">${esc(it.e)}</span>`:'';
    if(ok) panel('ok','Richtig!',`<div class="ex">${it.e?'<span class="sm">'+esc(it.e)+'</span>':''}</div>`);
    else panel('no','Noch nicht.',ln(letterOf(opts,v),'var(--no)',`<b>Ihre Antwort:</b> ${esc((it.w&&it.w[v])||('\u201e'+v+'\u201c passt hier nicht.'))}`)+ln(letterOf(opts,it.o[0]),'var(--ok)',`<b>Richtig:</b> ${esc(it.o[0])}${e}`));
  };
  if(rec0){show(rec0); return}
  $$('.opt').forEach(b=>b.onclick=()=>{ const v=b.dataset.v, ok=v===it.o[0], rec={v,ok}; commit(rec,ok,it,'c'); show(rec) });
}
function taskO(it,meta,rec0){

}

function dragify(root,zones,onDrop,onTap){

    const chip=e.target.closest('.chip'); if(!chip||!root.contains(chip)||root.classList.contains('done')||e.button>0) return;

    try{chip.setPointerCapture(e.pointerId)}catch(_){}
    const move=ev=>{
      if(!fl){ if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<7) return;
        const r=chip.getBoundingClientRect(); fl=chip.cloneNode(true); fl.classList.add('float'); fl.style.width=r.width+'px'; fl._dx=x0-r.left; fl._dy=y0-r.top;

      const under=document.elementFromPoint(ev.clientX,ev.clientY); zone=zones().find(z=>z.contains(under))||null;

      zone.insertBefore(gap,before||null);
    };
    const up=()=>{
      chip.removeEventListener('pointermove',move); chip.removeEventListener('pointerup',up); chip.removeEventListener('pointercancel',up);
      if(!fl){onTap(chip);return}
      fl.remove(); chip.classList.remove('ghost');
      if(zone){const nx=gap&&gap.parentNode?gap.nextElementSibling:null; if(gap) gap.remove(); onDrop(chip,zone,nx&&nx.classList.contains('chip')?nx:null)} else if(gap) gap.remove();
    };
    chip.addEventListener('pointermove',move); chip.addEventListener('pointerup',up); chip.addEventListener('pointercancel',up);
  });
}

   <div class="btns" style="margin-top:14px"><button class="b1" id="chk">Pr\u00fcfen</button><button class="b2" id="sol">L\u00f6sung</button></div>`,false);
  $$('.seg button').forEach(b=>b.onclick=()=>{GMODE=b.dataset.m; LS.set('b2lueckenmodus',GMODE); boardGap()});
  const slots=$$('.gs'); const val=s=>box?s.textContent:s.value; let first=true,done=false;
  const setAct=k=>{act=k; slots.forEach(s=>s.classList.toggle('act',box&&+s.dataset.k===k))};
  const nextEmpty=()=>{const s=slots.find(x=>!x.textContent); return s?+s.dataset.k:-1};
  const fillSol=()=>{ slots.forEach(s=>{const k=+s.dataset.k; if(box) s.textContent=words[k]; else {s.value=words[k]; s.readOnly=true} s.classList.remove('no'); s.classList.add('ok')}); $$('.wbox button').forEach(b=>b.disabled=true); $$('.btns .b1,.btns .b2').forEach(b=>b.disabled=true); setAct(-1); done=true };
  if(S.ans[0]){ fillSol(); const b=S.ans[0]; panel(b.score===b.total?'ok':'no',`Ihr Ergebnis: ${b.score} von ${b.total}.`,'',`<button class="b1" id="nxt">Ergebnis ansehen</button>`); $('#nxt').onclick=result; return }
  if(box){ setAct(0);
    $$('.wbox button').forEach(b=>b.onclick=()=>{ if(done||act<0) return; const s=slots[act]; if(s.dataset.w) $(`.wbox button[data-w="${s.dataset.w}"]`).disabled=false; s.textContent=words[+b.dataset.w]; s.dataset.w=b.dataset.w; b.disabled=true; s.classList.remove('no'); setAct(nextEmpty())});
    slots.forEach(s=>s.onclick=()=>{ if(done) return; if(s.textContent){$(`.wbox button[data-w="${s.dataset.w}"]`).disabled=false; s.textContent=''; s.dataset.w=''; s.classList.remove('no')} setAct(+s.dataset.k)});
  } else slots.forEach(s=>{s.addEventListener('input',()=>s.classList.remove('no')); s.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); const n=slots[slots.indexOf(s)+1]; n?n.focus():$('#chk').click()}})});
  const mk=k=>({kd:'w',k:words[k].toLowerCase(),q:ctx[k],a:[words[k]],e:'L\u00fcckentext: '+g.t,ci:0});
  $('#chk').onclick=()=>{ if(done) return;
    if(slots.some(s=>!val(s).trim())){panel('no','Noch nicht fertig.',`<div class="ln">Bitte f\u00fcllen Sie zuerst alle L\u00fccken.</div>`,okBtn());$('#oks').onclick=hidePanel;return}
    let ok=0; const bad=[];
    slots.forEach(s=>{const k=+s.dataset.k,r=judge(val(s),[words[k]],false); if(r.k==='ok'){ok++; s.classList.remove('no'); s.classList.add('ok'); if(!box) s.readOnly=true; delErr(mk(k))} else {s.classList.add('no'); bad.push(k)}});
    if(first){first=false; boardSave(ok,words.length); bad.forEach(k=>addErr(mk(k),'w'))}
    if(!bad.length){done=true; setAct(-1); panel('ok','Alles richtig!','',`<button class="b1" id="nxt">Ergebnis ansehen</button>`); $('#nxt').onclick=result; return}
    panel('no',`${ok} von ${words.length} richtig.`,`<div class="ln">Die rot markierten L\u00fccken stimmen noch nicht. Pr\u00fcfen Sie Wortart und Form (Partizip, Endung) und korrigieren Sie sie.</div>`,`<button class="b1" id="again">Korrigieren</button>`); $('#again').onclick=hidePanel };
  $('#sol').onclick=()=>{ if(first){first=false; boardSave(0,words.length); words.forEach((w,k)=>addErr(mk(k),'w'))} fillSol();
    panel('no','So ist es richtig.',`<div class="ln">Beim erneuten \u00d6ffnen sehen Sie Ihr Ergebnis.</div>`,`<button class="b1" id="nxt">Ergebnis ansehen</button>`); $('#nxt').onclick=result };
}
// ---------- Ergebnis (freiwillig: alles ist schon gespeichert) ----------
function result(){
  const {L,ex,r}=S, T=tally(), tot=T.total, sc=T.score;
  const R=S.rounds||1, nextR=r<R&&!S.retry, ei=L.ex.indexOf(ex), nxE=(ei>=0&&!S.retry)?L.ex[ei+1]:null;
  const wrongIdx=[]; S.items.forEach((it,i)=>{ if(!isBoard(ex)&&S.ans[i]&&itemRes(S.ans[i],it,ex)==='no') wrongIdx.push(i)});
  const nums=wrongIdx.map(i=>i+1);
  const label=S.errMode?'Meine Fehler':`K${N} ${L.id==='wdh'?'Wdh':'L'+L.n} \u00b7 ${uebNr(ex)}${R>1&&!S.retry?' \u00b7 Runde '+r:''}`;
  const line=`${label} \u00b7 ${sc}/${tot}${nums.length?' \u00b7 Fehler: '+nums.join(', '):''}${T.open.length&&!isBoard(ex)?' \u00b7 noch offen: '+T.open.join(', '):''}`;
  const praise=!tot?'':(sc===tot?'Perfekt!':(sc>=tot*0.8?'Gut gemacht!':(sc>=tot*0.5?'Weiter so!':'Noch einmal \u00fcben \u2013 das klappt!')));
  let by='';
  if(ex.k==='test'&&!S.errMode){const g={}; S.items.forEach((it,i)=>{const t=it.ty||'GR'; g[t]=g[t]||[0,0]; g[t][1]++; if(itemRes(S.ans[i],it,ex)==='ok') g[t][0]++});
    const nm={WS:'Wortschatz',GR:'Grammatik',SC:'Schreiben',LE:'Lesen',HO:'H\u00f6ren',TE:'Wiederholung'};
    by=`<div class="card">${Object.keys(g).map(t=>`<div class="bk t-${t}"><span class="ico ib">${sv(IC[t],20)}</span><div class="bb"><div class="bt"><span>${nm[t]}</span><span>${g[t][0]} / ${g[t][1]}</span></div><div class="bar"><i><s style="width:${100*g[t][0]/g[t][1]}%"></s></i></div></div></div>`).join('')}</div>`}
  const errs=wrongIdx.length?`<div class="errs">${wrongIdx.slice(0,20).map(i=>`<button class="err" data-j="${i}">Aufgabe ${i+1}${S.items[i].src?' \u00b7 '+esc(S.items[i].src):''}</button>`).join('')}</div>`:'';
  const opens=(T.open.length&&!isBoard(ex))?`<div><div class="sm" style="font-weight:800;margin-bottom:6px">Noch offen</div><div class="errs">${T.open.map(i=>`<button class="err" style="background:var(--card);border-color:var(--line2);color:var(--ink)" data-j="${i-1}">Aufgabe ${i}</button>`).join('')}</div></div>`:'';
  const link=(h,t,c,mode)=>`<a class="${c}" href="${h}"${mode?` data-nav="${mode}"`:''}>${t}</a>`;
  const main=nextR?link(hashOf(L,ex,r+1),'N\u00e4chste Runde','b1','replace'):(nxE?link(hashOf(L,nxE),'N\u00e4chste \u00dcbung','b1','replace'):link(S.errMode?'#fehler':hashOf(L),S.errMode?'Zur\u00fcck':'Zur Lektion','b1','up'));
  app.innerHTML=header(L,ex,'Ergebnis',S.errMode,S.errMode?'#fehler':'')+
   `<div class="res"><div style="display:flex;align-items:center;gap:16px"><div class="ring" style="border-color:${sc===tot&&tot?'var(--ok)':(sc>=tot*0.5?'var(--star)':'var(--no)')}"><b>${sc}</b><small>von ${tot}</small></div>
   <div><span class="hand">${praise}</span><div class="sm" style="line-height:1.4">${wrongIdx.length||(isBoard(ex)&&sc<tot)?(ex.k==='test'?`${wrongIdx.length} Aufgabe${wrongIdx.length>1?'n':''} sollten Sie noch einmal ansehen.`:'Die Fehler sind in \u201eMeine Fehler\u201c gespeichert.'):(T.open.length&&!isBoard(ex)?'Es sind noch nicht alle Aufgaben beantwortet.':'Keine Fehler \u2013 super!')}</div></div></div>
   ${by}${errs}${opens}
   <div class="teach"><b class="l">F\u00dcR IHRE LEHRERIN</b><span style="font-size:15px;font-weight:700;line-height:1.4">${esc(line)}</span><button id="cpres">Ergebnis kopieren</button></div></div>
   <div class="panel" style="bottom:0"><div class="in"><div class="btns">${(wrongIdx.length||(isBoard(ex)&&sc<tot))&&!S.errMode?`<button class="b2" id="rep">Fehler wiederholen</button>`:''}${main}${(nextR||nxE)&&!S.errMode?link(hashOf(L),'Lektion','b2','up'):''}</div></div></div>`;
  document.body.classList.add('nonav');
  $('#cpres').onclick=()=>copy(line,'Ergebnis kopiert');
  $$('.err[data-j]').forEach(b=>b.onclick=()=>{ if(isBoard(ex)) return; S.idx=+b.dataset.j; task() });
  const rep=$('#rep'); if(rep) rep.onclick=()=>{
    let items;
    if(isBoard(ex)){ const E=getE(); items=Object.keys(E).filter(k=>E[k].ref===L.id+'-'+ex.id).map(k=>({...E[k].it,kd:E[k].k,ty:E[k].ty,ref:E[k].ref})) }
    else items=wrongIdx.map(i=>({...S.items[i],kd:kindOf(S.items[i],ex),ty:S.items[i].ty||ex.ty,src:S.items[i].src||ex.id,ref:S.items[i].ref||(L.id+'-'+(S.items[i].src&&/^\w+$/.test(S.items[i].src)?S.items[i].src:ex.id))}));
    if(!items.length) return;
    startRun({L,ex:{...ex,k:'c',rs:items.length,it:items},r:1,q:S.q,items,retry:true,rounds:1,errMode:false});
  };
}
render();

</script>
