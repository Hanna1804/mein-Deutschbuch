antwortung (f\u00fcr + A) ___  (\u201everantwortlich sein\u201c)", "o": ["tragen", "bringen", "geben"], "e": "die Verantwortung (f\u00fcr + A) tragen / \u00fcbernehmen \u2013 \u043d\u0435\u0441\u0442\u0438 \u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0441\u0442\u044c"}, {"q": "einen Termin ___  (\u201eeinen Termin festlegen\u201c)", "o": ["vereinbaren", "f\u00fchren", "leisten"], "e": "einen Termin vereinbaren \u2013 \u0434\u043e\u0433\u043e\u0432\u043e\u0440\u0438\u0442\u044c\u0441\u044f \u043e \u0432\u0441\u0442\u0440\u0435\u0447\u0435"}, {"q": "einen Antrag ___  (\u201eoffiziell (schriftlich) um etwas bitten\u201c)", "o": ["stellen", "f\u00fchren", "leisten"], "e": "einen Antrag stellen \u2013 \u043f\u043e\u0434\u0430\u0442\u044c \u0437\u0430\u044f\u0432\u043b\u0435\u043d\u0438\u0435"}, {"q": "sich Zeit (f\u00fcr + A) ___  (\u201esich f\u00fcr etwas genug Zeit g\u00f6nnen\u201c)", "o": ["nehmen", "haben", "kommen"], "e": "sich Zeit (f\u00fcr + A) nehmen \u2013 \u0443\u0434\u0435\u043b\u0438\u0442\u044c \u0432\u0440\u0435\u043c\u044f"}], "hint": "Aus allen Kapiteln bis hier."}, {"t": "4 \u00b7 Wiederholung: Adjektivendungen", "pool": 0, "items": [{"q": "Ich habe einen unbefristet___ Vertrag.", "o": ["en", "er", "es"], "e": "einen (Akkusativ maskulin) \u2192 -en."}, {"q": "Wir suchen eine zuverl\u00e4ssig___ Vertretung.", "o": ["e", "en", "er"], "e": "eine (Akkusativ feminin) \u2192 -e."}, {"q": "Sie arbeitet in einem gro\u00df___ Betrieb.", "o": ["en", "em", "er"], "e": "Dativ nach einem \u2192 -en."}, {"q": "Das ist ein befristet___ Vertrag.", "o": ["er", "e", "en"], "e": "ein + maskulin Nominativ: Der Artikel zeigt nichts \u2192 das Adjektiv zeigt -er."}, {"q": "Mit neu___ Kollegen spreche ich immer Hochdeutsch.", "o": ["en", "e", "er"], "e": "ohne Artikel, Dativ Plural \u2192 -en."}, {"q": "Der neu___ Dienstplan h\u00e4ngt in der K\u00fcche.", "o": ["e", "en", "er"], "e": "der + Nominativ \u2192 -e."}, {"q": "Wir haben flexibl___ Arbeitszeiten.", "o": ["e", "en", "er"], "e": "ohne Artikel, Akkusativ Plural \u2192 -e."}, {"q": "Ich trinke im B\u00fcro nur schwarz___ Kaffee.", "o": ["en", "er", "em"], "e": "ohne Artikel, Akkusativ maskulin \u2192 -en."}]}]}]};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function renderSet(el,set){
  const items=set.pool?shuffle(set.items).slice(0,set.pool):set.items;
  let ok=0,done=0;
  el.querySelector('.qs').innerHTML=items.map((it,i)=>`<div class="q" data-i="${i}"><p>${esc(it.q)}</p><div class="opts">${shuffle(it.o).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>${it.e?`<div class="ex">${esc(it.e)}</div>`:''}</div>`).join('');
  const sc=el.querySelector('.score'); const upd=()=>sc.textContent=`${ok} / ${items.length} richtig`; upd();
  el.querySelectorAll('.q').forEach(q=>{
    const it=items[+q.dataset.i];
    q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(q.classList.contains('done'))return;
      q.classList.add('done'); done++;
      q.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===it.o[0]) x.classList.add('ok')});
      if(b.dataset.v===it.o[0]) ok++; else b.classList.add('no');
      upd(); if(done===items.length) sc.textContent+=ok===items.length?' \u2013 super!':'';
    });
  });
}
let h='';
D.L.forEach(L=>{
  h+=`<section class="les" id="k${D.N}-${L.id}"><h2>${esc(L.title)}</h2>`;
  L.sets.forEach((s,i)=>{h+=`<div class="set" data-l="${L.id}" data-s="${i}"><div class="sethead"><h3>${esc(s.t)}</h3><span class="score"></span>${s.pool?'<button class="again">Neue Runde</button>':''}</div>${s.hint?`<p class="note">${esc(s.hint)}</p>`:''}<div class="qs"></div></div>`});
  h+=`</section>`;
});
document.querySelector('#app').innerHTML=h;
document.querySelectorAll('.set').forEach(el=>{
  const L=D.L.find(x=>x.id===el.dataset.l), s=L.sets[+el.dataset.s];
  renderSet(el,s);
  const a=el.querySelector('.again'); if(a) a.onclick=()=>renderSet(el,s);
});
</script>
