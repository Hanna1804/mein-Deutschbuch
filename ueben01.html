"Возраст — через sein."}]}, {"t": "14 · Zahlen", "hint": "Выберите правильное число.", "pool": 8, "items": [{"q": "16", "o": ["sechzehn", "sechszehn", "sechzig"], "e": ""}, {"q": "17", "o": ["siebzehn", "siebenzehn", "siebzig"], "e": ""}, {"q": "30", "o": ["dreißig", "dreizig", "dreizehn"], "e": ""}, {"q": "21", "o": ["einundzwanzig", "zwanzigeins", "zwanzigundeins"], "e": "Сначала единицы: ein-und-zwanzig."}, {"q": "45", "o": ["fünfundvierzig", "vierundfünfzig", "vierzigfünf"], "e": "Сначала 5, потом 40."}, {"q": "60", "o": ["sechzig", "sechszig", "sechzehn"], "e": ""}, {"q": "70", "o": ["siebzig", "siebenzig", "siebzehn"], "e": ""}, {"q": "99", "o": ["neunundneunzig", "neunzigneun", "neunundneunzehn"], "e": ""}, {"q": "dreiundachtzig", "o": ["83", "38", "33"], "e": ""}, {"q": "zwölf", "o": ["12", "20", "2"], "e": ""}, {"q": "vierundsechzig", "o": ["64", "46", "40"], "e": ""}]}, {"t": "15 · Alphabet", "hint": "Как называется буква?", "pool": 7, "items": [{"q": "V", "o": ["[фау]", "[вэ:]", "[эф]"], "e": "V — [фау]."}, {"q": "W", "o": ["[вэ:]", "[фау]", "[дубль-вэ]"], "e": "W — [вэ:]."}, {"q": "E", "o": ["[э:]", "[и:]", "[е]"], "e": ""}, {"q": "I", "o": ["[и:]", "[ай]", "[э:]"], "e": ""}, {"q": "J", "o": ["[йот]", "[джей]", "[гэ:]"], "e": ""}, {"q": "G", "o": ["[гэ:]", "[джи]", "[йот]"], "e": ""}, {"q": "Z", "o": ["[цэт]", "[зэт]", "[зэд]"], "e": ""}, {"q": "Y", "o": ["[ипсилон]", "[уай]", "[игрек]"], "e": ""}, {"q": "ß", "o": ["[эсцэт]", "[бэ]", "[дабл эс]"], "e": ""}, {"q": "@ в e-mail", "o": ["ät", "Punkt", "Strich"], "e": ""}]}, {"t": "16 · Wiederholung: Lektion 1", "hint": "Повторяем первый урок.", "pool": 6, "items": [{"q": "19:00 — вы приходите в гости.", "o": ["Guten Abend!", "Gute Nacht!", "Guten Morgen!"], "e": ""}, {"q": "— Freut mich! — …", "o": ["Mich auch!", "Ich auch!", "Danke, gut."], "e": ""}, {"q": "Anna kommt … Schweiz.", "o": ["aus der", "aus", "aus dem"], "e": ""}, {"q": "Wie … es Ihnen?", "o": ["geht", "gehst", "gehen"], "e": ""}, {"q": "Официал const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function renderSet(el,set){
  const items=set.pool?shuffle(set.items).slice(0,set.pool):set.items;
  let ok=0,done=0;
  el.querySelector('.qs').innerHTML=items.map((it,i)=>`<div class="q" data-i="${i}"><p>${esc(it.q)}</p><div class="opts">${shuffle(it.o).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>${it.e?`<div class="ex">${esc(it.e)}</div>`:''}</div>`).join('');
  const sc=el.querySelector('.score'); const upd=()=>sc.textContent=`${ok} из ${items.length} верно`; upd();
  el.querySelectorAll('.q').forEach(q=>{
    const it=items[+q.dataset.i];
    q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(q.classList.contains('done'))return;
      q.classList.add('done'); done++;
      q.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===it.o[0]) x.classList.add('ok')});
      if(b.dataset.v===it.o[0]) ok++; else b.classList.add('no');
      upd(); if(done===items.length) sc.textContent+=ok===items.length?' – super!':'';
    });
  });
}

// ---------- Письменные задания ----------
const unq=s=>s.normalize('NFC').replace(/[„“”"‚‘’']/g,'').replace(/\s+/g,' ').replace(/\s+([,.!?])/g,'$1').trim().replace(/[.!?]+$/,'').trim();
const noC=s=>s.replace(/,/g,'');
const fold=s=>s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss');
function judge(inp,acc){
  const u=unq(inp); if(!u) return {k:'empty'};
  for(const a0 of acc){const a=unq(a0);
    if(u===a) return {k:'ok'};
    if(noC(u)===noC(a)) return {k:'ok',tip:'Обратите внимание на запятую.'};
    if(fold(noC(u))===fold(noC(a))) return {k:'ok',tip:'Верно! Красивее с ä, ö, ü, ß: '+a0};
  }
  for(const a0 of acc){const a=unq(a0);
    if(fold(noC(u)).toLowerCase()===fold(noC(a)).toLowerCase()) return {k:'mid',tip:'Почти! Проверьте большие и маленькие буквы.'};
    const m=a.match(/^(der|die|das) (.+)$/); if(m&&fold(u).toLowerCase()===fold(m[2]).toLowerCase()) return {k:'mid',tip:'Почти! Напишите существительное с артиклем.'};
  }
  return {k:'no'};
}
function renderWrite(el,set){
  const items=set.pool?shuffle(set.items).slice(0,set.pool):set.items;
  let ok=0;
  el.querySelector('.qs').innerHTML=items.map((it,i)=>`<div class="wq" data-i="${i}"><p>${esc(it.q)}</p>${it.h?`<p class="hint">${esc(it.h)}</p>`:''}
   ${it.a[0].length>28?'<textarea rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort"></textarea>':'<input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort">'}
   ${it.tip?`<p class="hint tipline" hidden>💡 ${esc(it.tip)}</p>`:''}<div class="wrow"><button class="chk">Проверить</button>${['ä','ö','ü','ß','Ä','Ö','Ü'].map(c=>`<button class="uml" data-c="${c}">${c}</button>`).join('')}${it.tip?'<button class="tip">Подсказка</button>':''}<button class="sol">Показать ответ</button></div>
   <div class="fb"></div></div>`).join('');
  const sc=el.querySelector('.score'); const upd=()=>sc.textContent=`${ok} из ${items.length} верно`; upd();
  el.querySelectorAll('.wq').forEach(q=>{
    const it=items[+q.dataset.i], inp=q.querySelector('input,textarea'), fb=q.querySelector('.fb'); let fin=false;
    const show=(cls,html)=>{fb.className='fb '+cls; fb.innerHTML=html};
    const sol=()=>`<small>Ответ: <b>${esc(it.a[0])}</b>${it.a.length>1?' · тоже верно: '+it.a.slice(1).map(esc).join(' · '):''}${it.e?'<br>'+esc(it.e):''}</small>`;
    const check=()=>{ if(fin) return; const r=judge(inp.value,it.a);
      if(r.k==='empty'){show('mid','Сначала напишите ответ.');return}
      if(r.k==='ok'){fin=true; ok++; upd(); inp.className='ok'; inp.readOnly=true; show('ok','Richtig! Верно!'+(r.tip?' '+esc(r.tip):'')+sol()); return}
      inp.className='no'; show(r.k==='mid'?'mid':'no',(r.k==='mid'?esc(r.tip):'Пока неверно.')+' Попробуйте ещё раз или нажмите «Показать ответ».');
    };
    q.querySelector('.chk').onclick=check;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
    const tb=q.querySelector('.tip'); if(tb) tb.onclick=()=>{q.querySelector('.tipline').hidden=false; tb.disabled=true; inp.focus()};
    q.querySelector('.sol').onclick=()=>{ if(fin) return; fin=true; inp.readOnly=true; show('no','Посмотрите ответ:'+sol()); };
    q.querySelectorAll('.uml').forEach(b=>{b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ if(fin) return;
      const s=inp.selectionStart??inp.value.length, e2=inp.selectionEnd??s; inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e2);
      inp.focus(); inp.setSelectionRange(s+1,s+1); }});
  });
}
let h='';
D.L.forEach(L=>{
  h+=`<section class="les" id="k${D.N}-${L.id}"><h2>${esc(L.title)}</h2>`;
  L.sets.forEach((s,i)=>{h+=`<div class="set" data-l="${L.id}" data-s="${i}"><div class="sethead"><h3>${esc(s.t)}</h3><span class="score"></span>${s.pool?'<button class="again">Новый раунд</button>':''}</div>${s.hint?`<p class="note">${esc(s.hint)}</p>`:''}<div class="qs"></div></div>`});
  if(L.write&&L.write.length){
    h+=`<div class="wblock"><h3>✍ Selbst schreiben · Написать самому</h3><p>Здесь ответ нужно напечатать. Это по желанию, блок можно пропустить.</p>`;
    L.write.forEach((s,i)=>{h+=`<div class="set" data-l="${L.id}" data-w="${i}"><div class="sethead"><h3>${esc(s.t)}</h3><span class="score"></span>${s.pool?'<button class="again">Новый раунд</button>':''}</div>${s.hint?`<p class="note">${esc(s.hint)}</p>`:''}<div class="qs"></div></div>`});
    h+=`</div>`;
  }
  h+=`</section>`;
});
document.querySelector('#app').innerHTML=h;
document.querySelectorAll('.set').forEach(el=>{
  const L=D.L.find(x=>x.id===el.dataset.l);
  const w=el.dataset.w!==undefined, s=w?L.write[+el.dataset.w]:L.sets[+el.dataset.s], r=w?renderWrite:renderSet;
  r(el,s);
  const a=el.querySelector('.again'); if(a) a.onclick=()=>r(el,s);
});
</script>
