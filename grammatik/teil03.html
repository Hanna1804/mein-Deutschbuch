let ERR={}; try{ERR=JSON.parse(localStorage.getItem(FKEY)||'{}')}catch(e){}
const saveErr=()=>{try{localStorage.setItem(FKEY,JSON.stringify(ERR))}catch(e){} updErrBox()};
const stitle=(set,it)=>it._src||set.t.replace(/^\S+ · /,'');
const eid=(set,it)=>stitle(set,it)+'|'+it.q;
function addErr(set,it,kind){const x=Object.assign({},it,{_src:stitle(set,it)});ERR[eid(set,it)]={k:kind,t:x._src,it:x};saveErr()}
function delErr(set,it){const id=eid(set,it); if(ERR[id]){delete ERR[id];saveErr()}}
function updErrBox(){const b=document.querySelector('#errbox'); if(!b)return; const n=Object.keys(ERR).length;
  b.querySelector('.ecount').textContent=n?`${n} Aufgabe${n===1?'':'n'} mit Fehlern gespeichert.`:'Noch keine Fehler gespeichert – super! Wenn Sie sich irren, landet die Aufgabe automatisch hier.';
  b.querySelectorAll('.ebtn').forEach(x=>x.disabled=!n)}
function renderSet(el,set){
  const items=set.pool?shuffle(set.items).slice(0,set.pool):set.items;
  let ok=0,done=0; const wrong=[]; const rb=el.querySelector('.retry'); if(rb) rb.remove();
  el.querySelector('.qs').innerHTML=items.map((it,i)=>`<div class="q" data-i="${i}"><p>${esc(it.q)}</p><div class="opts">${shuffle(it.o).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>${it.e?`<div class="ex">${esc(it.e)}</div>`:''}</div>`).join('');
  const sc=el.querySelector('.score'); const upd=()=>sc.textContent=`${ok} / ${items.length} richtig`; upd();
  el.querySelectorAll('.q').forEach(q=>{
    const it=items[+q.dataset.i];
    q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(q.classList.contains('done'))return;
      q.classList.add('done'); done++;
      q.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===it.o[0]) x.classList.add('ok')});
      if(b.dataset.v===it.o[0]){ok++; delErr(set,it)} else {b.classList.add('no'); wrong.push(it); addErr(set,it,'c')}
      upd(); if(done===items.length){ sc.textContent+=ok===items.length?' – super!':''; if(wrong.length) retry(el,set,wrong,renderSet) }
    });
  });
}

// ---------- Письменные задания ----------
const unq=s=>s.normalize('NFC').replace(/[„“”"‚‘’']/g,'').replace(/\s+/g,' ').replace(/\s+([,.!?])/g,'$1').trim().replace(/[.!?]+$/,'').trim();
const noC=s=>s.replace(/,/g,'');
const fold=s=>s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss');
function judge(inp,acc){
  const u=unq(inp); if(!u) return {k:'empty'};
  for(const a0 of acc){const a=unq(a0);
    if(u===a) return {k:'ok'};
    if(noC(u)===noC(a)) return {k:'ok',tip:'Achten Sie auf das Komma.'};
    if(fold(noC(u))===fold(noC(a))) return {k:'ok',tip:'Richtig! Schöner mit ä, ö, ü, ß: '+a0};
  }
  for(const a0 of acc){const a=unq(a0);
    if(fold(noC(u)).toLowerCase()===fold(noC(a)).toLowerCase()) return {k:'mid',tip:'Fast! Prüfen Sie die Groß- und Kleinschreibung.'};
    const m=a.match(/^(der|die|das) (.+)$/); if(m&&fold(u).toLowerCase()===fold(m[2]).toLowerCase()) return {k:'mid',tip:'Fast! Schreiben Sie das Nomen mit Artikel.'};
  }
  return {k:'no'};
}
function renderWrite(el,set){
  const items=set.pool?shuffle(set.items).slice(0,set.pool):set.items;
  let ok=0, nfin=0; const wrong=[]; const rb=el.querySelector('.retry'); if(rb) rb.remove();
  const finish=()=>{ nfin++; if(nfin===items.length && wrong.length) retry(el,set,wrong,renderWrite) };
  el.querySelector('.qs').innerHTML=items.map((it,i)=>`<div class="wq" data-i="${i}"><p>${esc(it.q)}</p>${it.h?`<p class="hint">${esc(it.h)}</p>`:''}
   ${it.a[0].length>28?'<textarea rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort"></textarea>':'<input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort">'}
   ${it.tip?`<p class="hint tipline" hidden>💡 ${esc(it.tip)}</p>`:''}<div class="wrow"><button class="chk">Prüfen</button>${['ä','ö','ü','ß','Ä','Ö','Ü'].map(c=>`<button class="uml" data-c="${c}">${c}</button>`).join('')}${it.tip?'<button class="tip">Tipp</button>':''}<button class="sol">Lösung zeigen</button></div>
   <div class="fb"></div></div>`).join('');
  const sc=el.querySelector('.score'); const upd=()=>sc.textContent=`${ok} / ${items.length} richtig`; upd();
  el.querySelectorAll('.wq').forEach(q=>{
    const it=items[+q.dataset.i], inp=q.querySelector('input,textarea'), fb=q.querySelector('.fb'); let fin=false, marked=false;
    const show=(cls,html)=>{fb.className='fb '+cls; fb.innerHTML=html};
    const sol=()=>`<small>Lösung: <b>${esc(it.a[0])}</b>${it.a.length>1?' · auch richtig: '+it.a.slice(1).map(esc).join(' · '):''}${it.e?'<br>'+esc(it.e):''}</small>`;
    const check=()=>{ if(fin) return; const r=judge(inp.value,it.a);
      if(r.k==='empty'){show('mid','Bitte schreiben Sie zuerst eine Antwort.');return}
      if(r.k==='ok'){fin=true; ok++; upd(); delErr(set,it); inp.className='ok'; inp.readOnly=true; show('ok','Richtig!'+(r.tip?' '+esc(r.tip):'')+sol()); finish(); return}
      if(r.k==='no'&&!marked){marked=true; wrong.push(it); addErr(set,it,'w')}
      inp.className='no'; show(r.k==='mid'?'mid':'no',(r.k==='mid'?esc(r.tip):'Leider nicht richtig.')+' Versuchen Sie es noch einmal – oder tippen Sie auf „Lösung zeigen“.');
    };
    q.querySelector('.chk').onclick=check;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
    const tb=q.querySelector('.tip'); if(tb) tb.onclick=()=>{q.querySelector('.tipline').hidden=false; tb.disabled=true; inp.focus()};
    q.querySelector('.sol').onclick=()=>{ if(fin) return; fin=true; inp.readOnly=true; if(!marked){marked=true; wrong.push(it); addErr(set,it,'w')} show('no','Schauen Sie sich die Lösung an:'+sol()); finish(); };
    q.querySelectorAll('.uml').forEach(b=>{b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ if(fin) return;
      const s=inp.selectionStart??inp.value.length, e2=inp.selectionEnd??s; inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e2);
      inp.focus(); inp.setSelectionRange(s+1,s+1); }});
  });
}

function retry(el,set,wrong,fn){
  const b=document.createElement('button'); b.className='again retry'; b.style.marginTop='6px';
  b.textContent=`🔁 Nur die Fehler wiederholen (${wrong.length})`;
  b.onclick=()=>{fn(el,{t:set.t,pool:0,items:wrong.map(it=>Object.assign({},it,{_src:stitle(set,it)}))}); el.scrollIntoView({behavior:'smooth'})};
  el.appendChild(b);
}
let h='';
D.L.forEach(L=>{
  h+=`<section class="les" id="${L.id}"><h2>${esc(L.title)}</h2>`;
  L.sets.forEach((s,i)=>{h+=`<div class="set" data-l="${L.id}" data-s="${i}"><div class="sethead"><h3>${esc(s.t)}</h3><span class="score"></span>${s.pool?'<button class="again">Neue Runde</button>':''}</div>${s.hint?`<p class="note">${esc(s.hint)}</p>`:''}<div class="qs"></div></div>`});
  if(L.write&&L.write.length){
    h+=`<div class="wblock"><h3>✍ Selbst schreiben</h3><p>Hier tippen Sie die Antwort selbst. Diese Übungen sind freiwillig – Sie können sie auch überspringen.</p>`;
    L.write.forEach((s,i)=>{h+=`<div class="set" data-l="${L.id}" data-w="${i}"><div class="sethead"><h3>${esc(s.t)}</h3><span class="score"></span>${s.pool?'<button class="again">Neue Runde</button>':''}</div>${s.hint?`<p class="note">${esc(s.hint)}</p>`:''}<div class="qs"></div></div>`});
    h+=`</div>`;
  }
  h+=`</section>`;
});
h=`<section class="les" id="fehler"><div id="errbox" class="wblock" style="border-color:var(--no)"><h3 style="color:var(--no)">🔁 Meine Fehler</h3><p class="ecount"></p>
  <div class="wrow"><button class="chk ebtn" id="errgo" style="background:var(--no);border-color:var(--no)">Fehler üben</button><button class="ebtn" id="errclr">Liste leeren</button></div>
  <div id="errsets"></div></div></section>`+h;
document.querySelector('#app').innerHTML=h;
updErrBox();
document.querySelector('#errgo').onclick=()=>{
  const all=Object.values(ERR), ch=all.filter(x=>x.k==='c'), wr=all.filter(x=>x.k==='w');
  const mk=(id,title)=>`<div class="set" id="${id}"><div class="sethead"><h3>${title}</h3><span class="score"></span></div><div class="qs"></div></div>`;
  const box=document.querySelector('#errsets'); box.innerHTML=(ch.length?mk('errc','Antippen'):'')+(wr.length?mk('errw','Selbst schreiben'):'');
  const fake=(arr)=>({t:'Fehler',pool:0,items:arr.map(x=>x.it)});   // it._src помнит исходное упражнение
  if(ch.length) renderSet(document.querySelector('#errc'),fake(ch));
  if(wr.length) renderWrite(document.querySelector('#errw'),fake(wr));
};
document.querySelector('#errclr').onclick=()=>{if(confirm('Alle gespeicherten Fehler löschen?')){ERR={};saveErr();document.querySelector('#errsets').innerHTML=''}};
document.querySelectorAll('.set').forEach(el=>{
  const L=D.L.find(x=>x.id===el.dataset.l);
  const w=el.dataset.w!==undefined, s=w?L.write[+el.dataset.w]:L.sets[+el.dataset.s], r=w?renderWrite:renderSet;
  r(el,s);
  const a=el.querySelector('.again'); if(a) a.onclick=()=>r(el,s);
});
</script>
</body></html>
